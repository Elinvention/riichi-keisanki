<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
    <link rel="icon" type="image/png" href="assets/icons/icon.png">
    <link rel="stylesheet" href="assets/css/bulma.css">
    <link rel="stylesheet" href="assets/css/bulma-steps.css">
    <title>リーチ計算機 Riichi Keisanki</title>
    <script src="assets/js/main.js" type="text/javascript" defer></script>
    <style>
      h1 { 
        /* https://www.madebymike.com.au/writing/precise-control-responsive-typography/ */
        font-size: calc(1em + (8 - 1) * ((100vw - 400px) / (1000 - 400)));
      }
      .hand {
        background-color: forestgreen;
        padding: 1em;
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        min-height: 64px;
        box-sizing: content-box;
      }
      #interactive {
        font-size: small;
      }
      #hand-properties {
        display: flex;
        flex-direction: row;
        gap: 4px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .mahjong-tile {
        max-width: 9vw;
        max-height: 64px;
        width: 48px;
        user-select: none;
        transition: scale 0.1s cubic-bezier(1,0,0,1);
      }
      .mahjong-tile:hover, .tile-group:hover .mahjong-tile {
        scale: 105%;
      }
      .dora {
        animation-name: dora;
        animation-duration: 4s;
        animation-timing-function: ease;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }
      @keyframes dora {
        0%, 42%, 58%, 100% {
          rotate: 0deg;
        }
        45%, 50%, 55% {
          rotate: 3deg;
        }
        48%, 52% {
          rotate: -3deg;
        }
      }
      .rotated {
        transform: rotate(90deg);
        margin: 0 10px 0 10px;
        max-height: 72px;
      }
      .tile-row, .tile-group {
        display: inline-flex;
        flex-wrap: nowrap;
        gap: 2px;
      }
      .tile-group {
        margin-left: 1em;
        transition: all 0.1s cubic-bezier(1,0,0,1);
      }
      .tile-group:hover {
        gap: 5px;
        margin-left: calc(1em + 2px);
        margin-right: 2px;
      }
      .flex-column-2px {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .keyboard, .flex-center {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        justify-content: center;
        align-content: center;
        align-items: center;
        flex-direction: column;
      }
      table, th, td {
        padding: 10px;
        border: 1px solid #d2caca;
        border-collapse: collapse;
      }
      html, body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
      }
      main {
        flex: 1 0 auto;
        margin: 8px;
      }
      footer {
        flex-shrink: 0;
        text-align: center;
        border-top: 5px solid rgb(185, 60, 60);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1 class="title is-1">リーチ計算機 Riichi Keisanki</h1>

      <div id="app"></div>
    </main>

    <audio id="klick4" src="assets/sounds/klick4.ogg"></audio>
  </body>
</html>
